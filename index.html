<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vova Update</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden; cursor: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #slide {
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    object-fit: contain;
    user-select: none; -webkit-user-select: none;
    display: block;
  }
  /* лёгкое затемнение-перелистывание */
  #slide { transition: opacity .12s linear; }
  #slide.fade { opacity: 0; }
  #counter {
    position: fixed; right: 24px; bottom: 18px;
    font: 500 22px/1 -apple-system, Arial, sans-serif;
    color: rgba(255,255,255,.28);
    pointer-events: none; opacity: 0;
    transition: opacity .3s;
  }
  #counter.show { opacity: 1; }
</style>
</head>
<body>
  <div id="stage">
    <img id="slide" alt="">
  </div>
  <div id="counter"></div>

<script>
(function () {
  var TOTAL = 12;
  var slides = [];
  for (var i = 1; i <= TOTAL; i++) {
    slides.push('slides/slide-' + (i < 10 ? '0' + i : i) + '.jpg');
  }

  var img = document.getElementById('slide');
  var counter = document.getElementById('counter');
  var idx = 0;
  var counterTimer = null;

  // блокировка управления на первые 20 секунд после входа
  var LOCK_MS = 20000;
  var locked = true;
  setTimeout(function () { locked = false; }, LOCK_MS);

  // предзагрузка всех слайдов
  var pre = [];
  for (var k = 0; k < slides.length; k++) {
    var p = new Image();
    p.src = slides[k];
    pre.push(p);
  }

  function showCounter() {
    counter.textContent = (idx + 1) + ' / ' + TOTAL;
    counter.classList.add('show');
    if (counterTimer) clearTimeout(counterTimer);
    counterTimer = setTimeout(function () {
      counter.classList.remove('show');
    }, 1400);
  }

  function render() {
    img.classList.add('fade');
    setTimeout(function () {
      img.src = slides[idx];
      img.classList.remove('fade');
    }, 110);
    showCounter();
  }

  function next() { if (idx < TOTAL - 1) { idx++; render(); } }
  function prev() { if (idx > 0) { idx--; render(); } }
  function first() { idx = 0; render(); }
  function last() { idx = TOTAL - 1; render(); }

  // первый слайд без анимации
  img.src = slides[0];
  showCounter();

  // клавиатура / пульт ТВ (стрелки + OK=Enter)
  document.addEventListener('keydown', function (e) {
    if (locked) { e.preventDefault(); return; }
    switch (e.keyCode) {
      case 39: case 40: case 32: case 13: case 34: case 78: // → ↓ Space Enter PageDown N
        next(); e.preventDefault(); break;
      case 37: case 38: case 33: case 8: case 80: // ← ↑ PageUp Backspace P
        prev(); e.preventDefault(); break;
      case 36: first(); e.preventDefault(); break; // Home
      case 35: last(); e.preventDefault(); break;  // End
      case 70: // F — полный экран
        toggleFull(); e.preventDefault(); break;
    }
  });

  // клик / тап: правая половина — вперёд, левая — назад
  document.addEventListener('click', function (e) {
    if (locked) return;
    if (e.clientX < window.innerWidth * 0.3) prev();
    else next();
  });

  function toggleFull() {
    var el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  }
})();
</script>
</body>
</html>
